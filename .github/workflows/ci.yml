name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rag-qa-system:ci .

      - name: Run container and test import
        run: |
          docker run --rm \
            --env GOOGLE_API_KEY=test-key \
            --env QDRANT_URL=http://localhost:6333 \
            --env QDRANT_API_KEY=test-key \
            rag-qa-system:ci \
            python -c "from app.main import app; print('App loaded successfully')"